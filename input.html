<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ことばを残す</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 12px;
            margin: 0;
            background: #111;
            color: #fff;
            box-sizing: border-box;
        }

        textarea {
            width: 100%;
            height: 140px;
            font-size: 22px;
            line-height: 1.5;
            padding: 12px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 16px;
            font-size: 22px;
            margin-top: 12px;
            box-sizing: border-box;
        }

        h2 {
            font-size: 26px;
            margin: 8px 0 12px 0;
        }
    </style>
</head>

<body>

    <h2 id="pageTitle">とき・のおと</h2>
    <p>きょう、ここにきました。</p>
    <p>15文字ぐらいまでの短いメッセージを入れてください。記帳ノート、試し書きのつもりでお気軽に🥰</p>

    <textarea id="input"></textarea>
    <button onclick="send()">送信</button>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzzzVbVPn5Uw7cVMzvBYgnk_otNhW5gVJc_9WOTVUYY_yvNaj_dnrqEgKP-b3GhgcCM/exec";
        const ACTIVE_PLACE_STORAGE_KEY = "kaya-note-active-place-id";
        const PLACE_QUERY_PARAM = "place";
        const SPREADSHEET_ID = "1l2Ebe6o6l3irnh01hgDWIVw3pPY9cH71jOD7nArO-oE";
        const PLACES_CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=places`;
        let activePlace = null;

        function normalizePlaceId(value) {
            return String(value || "")
                .trim()
                .toLowerCase()
                .replace(/\s+/g, "-")
                .replace(/[^a-z0-9\-_]/g, "");
        }

        function parseCsvRows(text) {
            const rows = [];
            let row = [];
            let field = "";
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const ch = text[i];

                if (inQuotes) {
                    if (ch === '"' && text[i + 1] === '"') {
                        field += '"';
                        i++;
                    } else if (ch === '"') {
                        inQuotes = false;
                    } else {
                        field += ch;
                    }
                } else if (ch === '"') {
                    inQuotes = true;
                } else if (ch === ",") {
                    row.push(field);
                    field = "";
                } else if (ch === "\n") {
                    row.push(field);
                    rows.push(row);
                    row = [];
                    field = "";
                } else if (ch !== "\r") {
                    field += ch;
                }
            }

            if (field || row.length) {
                row.push(field);
                rows.push(row);
            }

            return rows;
        }

        function cleanCsvValue(value) {
            return String(value || "")
                .replace(/\uFEFF/g, "")
                .trim();
        }

        function cell(row, headers, name, fallbackIndex) {
            const index = headers.indexOf(name);
            return cleanCsvValue(row[index >= 0 ? index : fallbackIndex]);
        }

        function getPlaceIdFromUrl() {
            try {
                const params = new URLSearchParams(window.location.search);
                return normalizePlaceId(params.get(PLACE_QUERY_PARAM) || "");
            } catch (e) {
                return "";
            }
        }

        async function applyPlaceTitle() {
            try {
                const res = await fetch(PLACES_CSV_URL);
                const text = await res.text();
                if (text.startsWith("<!DOCTYPE html") || text.startsWith("<html")) return null;

                const rows = parseCsvRows(text);
                const headers = (rows.shift() || []).map(cleanCsvValue);
                const urlPlaceId = getPlaceIdFromUrl();
                const activeId = normalizePlaceId(
                    urlPlaceId || localStorage.getItem(ACTIVE_PLACE_STORAGE_KEY)
                );
                const places = rows.map(row => {
                    const id = normalizePlaceId(cell(row, headers, "id", 0));
                    const name = cell(row, headers, "name", 1);
                    const title = cell(row, headers, "title", 2);
                    const date = cell(row, headers, "date", 3);
                    const locationLabel = cell(row, headers, "locationLabel", 4);

                    if (!id || !name) return null;

                    return {
                        id,
                        name,
                        title: title || `${name}のおと`,
                        date,
                        locationLabel
                    };
                }).filter(Boolean);

                let place =
                    places.find(item => item.id === activeId);

                if (!place) {
                    if (!activeId && places.length > 0) {
                        // fallback: if no active place is stored yet, use the first sheet entry.
                        place = places[0];
                        localStorage.setItem(
                            ACTIVE_PLACE_STORAGE_KEY,
                            place.id
                        );
                    } else if (activeId) {
                        // preserve the selected active place even when the sheet isn't updated yet.
                        place = {
                            id: activeId,
                            name: activeId,
                            title: activeId,
                            date: "",
                            locationLabel: ""
                        };
                    }
                }

                if (urlPlaceId) {
                    localStorage.setItem(ACTIVE_PLACE_STORAGE_KEY, activeId);
                }

                if (!place) return null;
                activePlace = place;

                const resolvedTitle =
                    place.title || `${place.id}`;

                document.title = resolvedTitle;
                document.getElementById("pageTitle").textContent = resolvedTitle;

                console.log("active place:", place);
                return place;
            } catch (e) {
                console.warn("place title load failed", e);
                return null;
            }
        }

        function assertGasSuccess(text) {
            const body = String(text || "").trim();

            if (
                body.startsWith("<!DOCTYPE html") ||
                body.startsWith("<html")
            ) {
                throw new Error("Apps ScriptがHTMLを返しました。公開設定または権限を確認してください");
            }

            if (!body) {
                throw new Error("Apps Scriptの応答が空です");
            }

            try {
                const data = JSON.parse(body);
                const status = String(data.status || data.result || "").toLowerCase();

                if (
                    data.ok === true ||
                    data.success === true ||
                    status === "ok" ||
                    status === "success"
                ) {
                    return;
                }
                if (
                    data.ok === false ||
                    data.success === false ||
                    status === "error" ||
                    data.error
                ) {
                    throw new Error(data.message || data.error || body);
                }
            } catch (e) {
                if (!(e instanceof SyntaxError)) throw e;
            }

            if (/^(ok|success|saved|done|appended)$/i.test(body)) {
                return;
            }
            if (/error|exception|failed|unauthori[sz]ed|permission|権限|失敗/i.test(body)) {
                throw new Error(body.slice(0, 120));
            }

            throw new Error("Apps Scriptの成功応答を確認できません: " + body.slice(0, 80));
        }

        function getLocation() {
            // fallback: 福知山駅
            const fallback = {
                lat: 35.3009,
                lng: 135.1206
            };

            if (!navigator.geolocation) {
                return Promise.resolve(fallback);
            }

            return new Promise(resolve => {
                navigator.geolocation.getCurrentPosition(position => {
                    resolve({
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    });
                }, err => {
                    console.warn("位置情報の取得に失敗したため、福知山駅の座標を使用します", err);
                    resolve(fallback);
                }, {
                    enableHighAccuracy: false,
                    timeout: 5000,
                    maximumAge: 60000
                });
            });
        }

        async function send() {
            const text = document.getElementById("input").value.trim();
            if (!text) return;

            try {
                if (!activePlace) {
                    await applyPlaceTitle();
                }
                if (!activePlace) {
                    throw new Error("場所情報を読み込めませんでした");
                }

                const placeId = normalizePlaceId(activePlace.id);
                if (!placeId) {
                    throw new Error("場所IDを取得できませんでした");
                }

                const placeName =
                    activePlace.locationLabel ||
                    activePlace.name ||
                    placeId;
                const location = await getLocation();

                const res = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "addMessage",
                        sheet: "messages",
                        spreadsheetId: SPREADSHEET_ID,
                        text: text,
                        weight: 1,
                        placeId: placeId,
                        placeName: placeName,
                        date: activePlace.date || "",
                        lat: location.lat,
                        lng: location.lng
                    })
                });

                if (!res.ok) {
                    throw new Error("HTTP " + res.status);
                }

                const data = await res.text();
                console.log("GAS response:", data);
                assertGasSuccess(data);
                alert("送信しました");
                document.getElementById("input").value = "";
            } catch (err) {
                alert("送信失敗: " + err.message);
                console.error(err);
            }
        }

        window.addEventListener("storage", event => {
            if (event.key === ACTIVE_PLACE_STORAGE_KEY) {
                applyPlaceTitle();
            }
        });

        applyPlaceTitle();
    </script>

</body>

</html>
