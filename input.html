<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ことばを残す</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 12px;
            margin: 0;
            background: #111;
            color: #fff;
            box-sizing: border-box;
        }

        textarea {
            width: 100%;
            height: 140px;
            font-size: 22px;
            line-height: 1.5;
            padding: 12px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 16px;
            font-size: 22px;
            margin-top: 12px;
            box-sizing: border-box;
        }

        h2 {
            font-size: 26px;
            margin: 8px 0 12px 0;
        }
    </style>
</head>

<body>

    <h2 id="pageTitle">ちいとま・のおと</h2>
    <p>きょう、ここにきました。</p>
    <p>15文字ぐらいまでの短いメッセージを入れてください。記帳ノート、試し書きのつもりでお気軽に🥰</p>

    <textarea id="input"></textarea>
    <button onclick="send()">送信</button>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbycfPF2m6Z2NTovwoEcmZX2HWzKIxxmdMsTQ8udNu2o7pceN5UWm3fNfqMviVERqCns/exec";
        const ACTIVE_PLACE_STORAGE_KEY = "kaya-note-active-place-id";
        const SPREADSHEET_ID = "1l2Ebe6o6l3irnh01hgDWIVw3pPY9cH71jOD7nArO-oE";
        const PLACES_CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=places`;

        function normalizePlaceId(value) {
            return String(value || "")
                .trim()
                .toLowerCase()
                .replace(/\s+/g, "-")
                .replace(/[^a-z0-9\-_]/g, "");
        }

        function parseCsvRows(text) {
            const rows = [];
            let row = [];
            let field = "";
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const ch = text[i];

                if (inQuotes) {
                    if (ch === '"' && text[i + 1] === '"') {
                        field += '"';
                        i++;
                    } else if (ch === '"') {
                        inQuotes = false;
                    } else {
                        field += ch;
                    }
                } else if (ch === '"') {
                    inQuotes = true;
                } else if (ch === ",") {
                    row.push(field);
                    field = "";
                } else if (ch === "\n") {
                    row.push(field);
                    rows.push(row);
                    row = [];
                    field = "";
                } else if (ch !== "\r") {
                    field += ch;
                }
            }

            if (field || row.length) {
                row.push(field);
                rows.push(row);
            }

            return rows;
        }

        function cleanCsvValue(value) {
            return String(value || "")
                .replace(/\uFEFF/g, "")
                .trim();
        }

        function cell(row, headers, name, fallbackIndex) {
            const index = headers.indexOf(name);
            return cleanCsvValue(row[index >= 0 ? index : fallbackIndex]);
        }

        async function applyPlaceTitle() {
            try {
                const res = await fetch(PLACES_CSV_URL);
                const text = await res.text();
                if (text.startsWith("<!DOCTYPE html")) return;

                const rows = parseCsvRows(text);
                const headers = (rows.shift() || []).map(cleanCsvValue);
                const activeId = normalizePlaceId(
                    localStorage.getItem(ACTIVE_PLACE_STORAGE_KEY)
                );
                const places = rows.map(row => {
                    const id = normalizePlaceId(cell(row, headers, "id", 0));
                    const name = cell(row, headers, "name", 1);
                    const title = cell(row, headers, "title", 2);

                    if (!id || !name) return null;

                    return {
                        id,
                        title: title || `${name}のおと`
                    };
                }).filter(Boolean);

                let place =
                    places.find(item => item.id === activeId);

                // fallback:
                // if active place is not stored yet,
                // use first sheet entry and store it.
                if (!place && places.length > 0) {
                    place = places[0];

                    localStorage.setItem(
                        ACTIVE_PLACE_STORAGE_KEY,
                        place.id
                    );
                }

                if (!place) return;

                const resolvedTitle =
                    place.title || `${place.id}`;

                document.title = resolvedTitle;
                document.getElementById("pageTitle").textContent = resolvedTitle;

                console.log("active place:", place);
            } catch (e) {
                console.warn("place title load failed", e);
            }
        }

        function send() {
            const text = document.getElementById("input").value.trim();
            if (!text) return;

            // fallback: 福知山駅
            const fallbackLat = 35.3009;
            const fallbackLng = 135.1206;

            function postWithLocation(lat, lng) {
                fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        text: text,
                        lat: lat,
                        lng: lng
                    })
                })
                    .then(res => {
                        if (!res.ok) {
                            throw new Error("HTTP " + res.status);
                        }
                        return res.text();
                    })
                    .then(data => {
                        console.log("GAS response:", data);
                        alert("送信しました");
                        document.getElementById("input").value = "";
                    })
                    .catch(err => {
                        alert("送信失敗: " + err.message);
                        console.error(err);
                    });
            }

            // 位置情報が使えない場合は福知山駅座標を使う
            if (!navigator.geolocation) {
                postWithLocation(fallbackLat, fallbackLng);
                return;
            }

            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                postWithLocation(lat, lng);
            }, err => {
                console.warn("位置情報の取得に失敗したため、福知山駅の座標を使用します", err);
                postWithLocation(fallbackLat, fallbackLng);
            }, {
                enableHighAccuracy: false,
                timeout: 5000,
                maximumAge: 60000
            });
        }

        applyPlaceTitle();
    </script>

</body>

</html>
